<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="ollama-seq-title ollama-seq-desc">
      <title id="ollama-seq-title">Streaming chat with tool calls</title>
      <desc id="ollama-seq-desc">A Dataiku completion flows through OllamaLLM to Ollama, with optional non-stream fallback and separate toolCalls chunks.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4F6C61"/>
        </marker>
        <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#12211D"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#12211D"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F0F3F3"/>

      <!-- Lifelines -->
      <line x1="160" y1="112" x2="160" y2="520" stroke="rgba(18,33,29,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="488" y1="112" x2="488" y2="520" stroke="rgba(18,33,29,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="816" y1="112" x2="816" y2="520" stroke="rgba(18,33,29,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="484" y="156" width="8" height="320" fill="rgba(18,33,29,0.06)" stroke="#4F6C61" stroke-width="0.8"/>
      <rect x="812" y="212" width="8" height="176" fill="rgba(18,33,29,0.06)" stroke="#4F6C61" stroke-width="0.8"/>

      <!-- opt fragment -->
      <rect x="432" y="312" width="424" height="96" rx="4"
            fill="rgba(18,33,29,0.02)" stroke="rgba(18,33,29,0.22)" stroke-width="1"/>
      <rect x="432" y="312" width="36" height="16" rx="2" fill="#F0F3F3" stroke="rgba(18,33,29,0.22)" stroke-width="1"/>
      <text x="450" y="324" fill="#4F6C61" font-size="8"
            font-family="'Space Mono', 'SF Mono', Menlo, Consolas, monospace"
            text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="444" y="344" fill="#4F6C61" font-size="8"
            font-family="'Space Mono', 'SF Mono', Menlo, Consolas, monospace"
            letter-spacing="0.04em">[stream fails before output]</text>

      <!-- Messages -->
      <line x1="160" y1="168" x2="488" y2="168" stroke="#4F6C61" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="492" y1="224" x2="816" y2="224" stroke="#12211D" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="812" y1="280" x2="496" y2="280" stroke="#4F6C61" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="492" y1="368" x2="816" y2="368" stroke="#4F6C61" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="488" y1="448" x2="160" y2="448" stroke="#12211D" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
      <line x1="488" y1="496" x2="160" y2="496" stroke="#4F6C61" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="248" y="152" width="152" height="12" rx="2" fill="#F0F3F3"/>
      <text x="324" y="162" fill="#4F6C61" font-size="8"
            font-family="'Space Mono', 'SF Mono', Menlo, Consolas, monospace"
            text-anchor="middle" letter-spacing="0.06em">COMPLETION + TOOLS</text>

      <rect x="576" y="208" width="152" height="12" rx="2" fill="#F0F3F3"/>
      <text x="652" y="218" fill="#12211D" font-size="8"
            font-family="'Space Mono', 'SF Mono', Menlo, Consolas, monospace"
            text-anchor="middle" letter-spacing="0.06em">POST /V1/CHAT/COMPLETIONS</text>

      <rect x="576" y="264" width="112" height="12" rx="2" fill="#F0F3F3"/>
      <text x="632" y="274" fill="#4F6C61" font-size="8"
            font-family="'Space Mono', 'SF Mono', Menlo, Consolas, monospace"
            text-anchor="middle" letter-spacing="0.06em">STREAM DELTAS</text>

      <rect x="576" y="352" width="128" height="12" rx="2" fill="#F0F3F3"/>
      <text x="640" y="362" fill="#4F6C61" font-size="8"
            font-family="'Space Mono', 'SF Mono', Menlo, Consolas, monospace"
            text-anchor="middle" letter-spacing="0.06em">NON-STREAM RETRY</text>

      <rect x="248" y="432" width="120" height="12" rx="2" fill="#F0F3F3"/>
      <text x="308" y="442" fill="#12211D" font-size="8"
            font-family="'Space Mono', 'SF Mono', Menlo, Consolas, monospace"
            text-anchor="middle" letter-spacing="0.06em">TOOLCALLS CHUNK</text>

      <rect x="248" y="480" width="104" height="12" rx="2" fill="#F0F3F3"/>
      <text x="300" y="490" fill="#4F6C61" font-size="8"
            font-family="'Space Mono', 'SF Mono', Menlo, Consolas, monospace"
            text-anchor="middle" letter-spacing="0.06em">FOOTER + TOKENS</text>

      <!-- Actors -->
      <rect x="72" y="48" width="176" height="64" rx="6" fill="rgba(79,108,97,0.10)" stroke="#698277" stroke-width="1"/>
      <text x="160" y="84" fill="#12211D" font-size="12" font-weight="600"
            font-family="'Archivo', sans-serif" text-anchor="middle">Dataiku DSS</text>
      <text x="160" y="100" fill="#4F6C61" font-size="8"
            font-family="'Space Mono', 'SF Mono', Menlo, Consolas, monospace"
            text-anchor="middle">LLM Mesh</text>

      <rect x="384" y="48" width="208" height="64" rx="6" fill="#00D3E0" stroke="#12211D" stroke-width="1"/>
      <text x="488" y="84" fill="#12211D" font-size="12" font-weight="600"
            font-family="'Archivo', sans-serif" text-anchor="middle">OllamaLLM</text>
      <text x="488" y="100" fill="#385749" font-size="8"
            font-family="'Space Mono', 'SF Mono', Menlo, Consolas, monospace"
            text-anchor="middle">plugin handler</text>

      <rect x="728" y="48" width="176" height="64" rx="6" fill="rgba(18,33,29,0.03)" stroke="rgba(18,33,29,0.30)" stroke-width="1"/>
      <text x="816" y="84" fill="#12211D" font-size="12" font-weight="600"
            font-family="'Archivo', sans-serif" text-anchor="middle">Ollama</text>
      <text x="816" y="100" fill="#4F6C61" font-size="8"
            font-family="'Space Mono', 'SF Mono', Menlo, Consolas, monospace"
            text-anchor="middle">OpenAI /v1</text>
    </svg>
